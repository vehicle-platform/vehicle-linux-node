name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # vehicle-defs is public (D-033): the submodule needs no secret.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a release tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  # D-004 end to end: synthetic platform-bus replay -> kuksa-can-provider ->
  # Kuksa Databroker, then read every mapped VSS value back over gRPC.
  kuksa-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: uv sync --locked --group integration

      - name: Write the synthetic replay
        run: uv run vehicle-linux-node-replay replay/

      - name: Start databroker + provider (replay)
        run: docker compose -f docker-compose.yml -f docker-compose.replay.yml up -d

      - name: Read the values back from the databroker
        env:
          VEHICLE_KUKSA_ADDR: 127.0.0.1:55555
          VEHICLE_REPLAY_DIR: replay
        run: uv run pytest -v tests/integration

      - name: Container logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.replay.yml logs --no-color

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.replay.yml down
