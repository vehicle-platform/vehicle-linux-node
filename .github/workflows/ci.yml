name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # vehicle-defs is public (D-033): the submodule needs no secret.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a release tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.12.1"

      - name: Install dependencies (all extras, so OpenCV tests run and mypy sees every import)
        run: uv sync --locked --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (coverage floor in pyproject)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Dependency audit (pip-audit on the locked set)
        run: |
          uv export --frozen --no-hashes --all-extras --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit -r "$RUNNER_TEMP/req.txt" --disable-pip --no-deps --strict

  # D-004 end to end: synthetic platform-bus replay -> kuksa-can-provider ->
  # Kuksa Databroker, then read every mapped VSS value back over gRPC.
  kuksa-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: uv sync --locked --extra kuksa

      - name: Write the synthetic replay
        run: uv run vehicle-linux-node-replay replay/

      - name: Start databroker + provider (replay)
        run: docker compose -f docker-compose.yml -f docker-compose.replay.yml up -d

      - name: Read the values back from the databroker
        env:
          VEHICLE_KUKSA_ADDR: 127.0.0.1:55555
          VEHICLE_REPLAY_DIR: replay
        run: uv run pytest -v tests/integration

      - name: Container logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.replay.yml logs --no-color

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.replay.yml down

  # EDGE-1: the sandbox options must be effective, not just present. systemd-analyze
  # scores every unit offline (as installed: %h and User= substituted) against the
  # ceiling in deploy/exposure-thresholds.json.
  systemd-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: systemd version
        run: systemd-analyze --version | head -1

      - name: Exposure score per unit (fails above the threshold)
        run: |
          set -o pipefail
          python3 scripts/check_systemd_exposure.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full per-check output (diagnostics)
        if: always()
        run: python3 scripts/check_systemd_exposure.py --verbose || true

  # Aggregate required check (QUALITY CI-4): one stable name for the ruleset.
  # `skipped` counts as OK; `failure` and `cancelled` fail it.
  ci-ok:
    if: always()
    needs: [test, kuksa-replay, systemd-exposure]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
