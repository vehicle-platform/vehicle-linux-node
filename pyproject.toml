[project]
name = "vehicle-linux-node"
version = "0.1.0"
description = "SDV layer on the Raspberry Pi 5: Kuksa Databroker, platform CAN to VSS, applications."
readme = "README.md"
authors = [{ name = "vehicle-platform" }]
requires-python = ">=3.11"
dependencies = [
    "cantools>=39.4",
]

[project.scripts]
vehicle-linux-node-replay = "vehicle_linux_node.replay:main"
vehicle-linux-node-ldw = "vehicle_linux_node.ldw.cli:main"
vehicle-linux-node-blackbox = "vehicle_linux_node.blackbox.cli:main"
vehicle-linux-node-can = "vehicle_linux_node.canif:main"
vehicle-linux-node-live = "vehicle_linux_node.live.cli:main"
vehicle-linux-node-nodehealth = "vehicle_linux_node.nodehealth.cli:main"
vehicle-linux-node-llm-bench = "vehicle_linux_node.llmbench:main"

[project.optional-dependencies]
# Kuksa gRPC client for the on-vehicle services (black box); the CI kuksa-replay job installs it.
kuksa = [
    "kuksa-client>=0.6,<0.7",
]
# MQTT 5 client for the live uplink (D-109); needs the kuksa extra too.
live = [
    "paho-mqtt>=2.1,<3",
]
ldw = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "PLR0912", "PLR0913", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["position_vectors: the defs position-rule golden vectors (T22)"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60
max-args = 10

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# Baseline (PY-1): modules with pre-existing strict errors; new modules are strict.
# TODO(PY-1): shrink to zero, do not add entries.
[[tool.mypy.overrides]]
module = [
    "vehicle_linux_node.blackbox.service",
    "vehicle_linux_node.defs",
    "vehicle_linux_node.ldw.cli",
    "vehicle_linux_node.ldw.pipeline",
    "vehicle_linux_node.live.mqtt",
    "vehicle_linux_node.live.service",
    "vehicle_linux_node.nodehealth.service",
]
ignore_errors = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 89
# Ratchet floor: measured branch coverage (89.03%) rounded down; raise when main is >= 3 points above.
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
