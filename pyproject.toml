[project]
name = "vehicle-linux-node"
version = "0.1.0"
description = "SDV layer on the Raspberry Pi 5: Kuksa Databroker, platform CAN to VSS, applications."
readme = "README.md"
authors = [{ name = "vehicle-platform" }]
requires-python = ">=3.11"
dependencies = [
    "cantools>=39.4",
]

[project.scripts]
vehicle-linux-node-replay = "vehicle_linux_node.replay:main"
vehicle-linux-node-ldw = "vehicle_linux_node.ldw.cli:main"
vehicle-linux-node-blackbox = "vehicle_linux_node.blackbox.cli:main"
vehicle-linux-node-can = "vehicle_linux_node.canif:main"
vehicle-linux-node-live = "vehicle_linux_node.live.cli:main"

[project.optional-dependencies]
# Kuksa gRPC client for the on-vehicle services (black box); the CI kuksa-replay job installs it.
kuksa = [
    "kuksa-client>=0.6,<0.7",
]
# MQTT 5 client for the live uplink (D-109); needs the kuksa extra too.
live = [
    "paho-mqtt>=2.1,<3",
]
ldw = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
