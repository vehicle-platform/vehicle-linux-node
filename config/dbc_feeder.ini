# kuksa-can-provider configuration for vehicle-linux-node (D-004).
# Paths are inside the container: the defs submodule is mounted read-only at /defs.

[general]
# Kuksa Databroker on the same host (both containers use host networking).
address = grpc://127.0.0.1:55555
# Generated by vehicle-defs: VSS 6.0 + the Vehicle.Motorcycle overlay with dbc2vss keys.
mapping = /defs/gen/vss/vss_dbc.json
# CAN -> VSS only. val2dbc would make this node transmit on CAN from VSS
# writes; linux-node publishes nothing on the platform bus through Kuksa.
dbc2val = True
val2dbc = False

[can]
# Platform bus only (D-021); the Raspi never polls the ECU. Overridden by
# CAN_PORT / --canport (vcan0 in development, the CAN HAT channel on the bike).
port = vcan0
j1939 = False
dbcfile = /defs/dbc/platform.dbc
